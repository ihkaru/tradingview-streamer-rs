[package]
name = "tradingview-streamer"
version = "0.1.0"
edition = "2021"
authors = ["ihkaru <ihkaru@users.noreply.github.com>"]
description = "High-performance, async Rust client & streamer for TradingView WebSocket data with native Extended Trading Hours (ETH) pre/post-market support."
license = "MIT"
keywords = ["tradingview", "market-data", "websocket", "ohlcv", "extended-hours"]
categories = ["finance", "network-programming", "asynchronous"]
readme = "README.md"
repository = "https://github.com/ihkaru/tradingview-streamer-rs"
documentation = "https://docs.rs/tradingview-streamer"
include = ["src/**/*", "tests/**/*", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots", "connect"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
rand = "0.8"
http = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json"] }

[dev-dependencies]
tokio = { version = "1.43", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
